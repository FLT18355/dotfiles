palette = "catppuccin_mocha"

# Format Layout (Pawlette Standard Order: Who -> Where -> Git Context -> Proxy)
format = """\
[╭╴](fg:mauve)\
$os\
$username\
(\
    at \
    $directory\
)\
$git_branch$git_status\
$cmd_duration${custom.proxy}\
(\
    $python\
    $conda\
    $nodejs\
    $c\
    $rust\
    $java\
)
[╰─](fg:mauve)$character\
"""

# Enable blank line between commands
add_newline = true

[character]
success_symbol = "[  ](bold fg:mauve)"
error_symbol = "[  ](bold fg:red)"

[os]
format = "[$symbol]($style)"
style = "bold mauve"
disabled = false

[os.symbols]
Alpine = " "
Arch = " "
CachyOS = " "
Debian = " "
EndeavourOS = " "
Fedora = " "
Linux = " "
Macos = " "
Manjaro = " "
Mint = " "
NixOS = " "
openSUSE = " "
Pop = " "
SUSE = " "
Ubuntu = " "
Windows = " "

[username]
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style) "
disabled = false
show_always = true

[directory]
format = "[$path](bold fg:mauve)[$read_only]($read_only_style) "
truncation_length = 2
style = "fg:mauve"
read_only_style = "fg:mauve"
before_repo_root_style = "fg:mauve"
truncation_symbol = "…/"
truncate_to_repo = true
read_only = "  "

[time]
disabled = true

[cmd_duration]
disabled = false
format = "took [ $duration]($style) "
style = "bold fg:red"
min_time = 500

[git_branch]
format = "via [$symbol$branch]($style) "
style = "bold fg:sky"
symbol = " "

[git_status]
disabled = false
format = "[$all_status$ahead_behind]($style)"
style = "bold fg:peach"
conflicted = "󰌹 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
modified = " "
staged = " "
untracked = " "
renamed = "➜ "
deleted = " "
stashed = " "

[docker_context]
disabled = false
symbol = " "

[package]
disabled = false

[nodejs]
format = "[$symbol$version]($style) "
style = "bold fg:green"
symbol = " "
version_format = "${raw}"
disabled = false

[python]
disabled = false
format = '[${symbol}${pyenv_prefix}(${version})( \($virtualenv\))]($style) '
symbol = " "
version_format = "${raw}"
style = "bold fg:yellow"

[conda]
format = "[$symbol$environment]($style) "
style = "bold fg:green"
ignore_base = false
disabled = false
symbol = " "

[java]
format = "[$symbol$version]($style) "
style = "bold fg:red"
version_format = "${raw}"
symbol = " "
disabled = false

[c]
format = "[$symbol($version(-$name))]($style) "
style = "bold fg:sky"
symbol = " "
version_format = "${raw}"
disabled = false

[rust]
format = "[$symbol$version]($style) "
style = "bold fg:mauve"
symbol = " "
version_format = "${raw}"
disabled = false

