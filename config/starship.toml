"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](blue)\
$os\
$username\
[](bg:pink fg:blue)\
$directory\
[](bg:mauve fg:pink)\
$git_branch\
$git_status\
[](bg:lavender fg:mauve)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$python\
[](bg:yellow fg:lavender)\
$conda\
[](bg:surface1 fg:yellow)\
$time\
[ ](fg:surface1)\
$line_break\
$cmd_duration\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:blue fg:crust"
format = '[$symbol]($style)'

[os.symbols]
Arch = "󰣇"

[username]
show_always = true
style_user = "bg:blue fg:crust"
style_root = "bg:blue fg:crust"
format = '[ $user ]($style)'

[directory]
style = "bg:pink fg:crust"
format = "[ 󰉋 $path ]($style)"
truncation_length = 3

[git_branch]
symbol = "󰊢"
style = "bg:mauve fg:crust"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:mauve fg:crust"
format = '[($all_status$ahead_behind )]($style)'

# ================= 语言段 =================
[nodejs]
symbol = ""
style = "bg:lavender fg:crust"
format = '[ $symbol $version ]($style)'

[bun]
symbol = ""
style = "bg:lavender fg:crust"
format = '[ $symbol $version ]($style)'

[c]
symbol = " "
style = "bg:lavender fg:crust"
format = '[ $symbol $version ]($style)'

[rust]
symbol = ""
style = "bg:lavender fg:crust"
format = '[ $symbol $version ]($style)'

[golang]
symbol = ""
style = "bg:lavender fg:crust"
format = '[ $symbol $version ]($style)'

[python]
symbol = ""
style = "bg:lavender fg:crust"
format = '[ $symbol $version ]($style)'

[conda]
symbol = "󰐊"
style = "bg:yellow fg:crust"
format = '[ $symbol $environment ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:surface1 fg:text"
format = '[ 󱑎 $time 喵 ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[󰁔](bold fg:green)'
error_symbol = '[󰅚 喵呜>_<](bold fg:red)'

[cmd_duration]
show_milliseconds = false
format = "[ 󱎫 $duration ]($style)"
style = "fg:green"
disabled = false
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"