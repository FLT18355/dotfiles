    { name = ".git", text = "󰊢", fg = "#fab387" }, # Peach (Git标志色)
    { name = "Github", text = "󰊢", fg = "#fab387" },
    { name = "src", text = "", fg = "#89b4fa" }, # Blue
]

# ==========================================
# 3. 预设文件扩展名
