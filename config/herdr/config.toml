onboarding = false
# herdr 配置喵~ 放在 ~/.config/herdr/config.toml 就对啦

# ==========================================
# 主题与外观喵（Catppuccin Mocha 自定义精细调色）
# ==========================================
[theme]
# 基础主题使用 catppuccin 喵
name = "catppuccin"
auto_switch = false
# 如果想微调颜色，可以用 [theme.custom] 覆盖喵

[theme.custom]
# 让背景真正透出壁纸
panel_bg = "reset"
sidebar_bg = "reset"

# 主色调（强调色）：Catppuccin Mauve 紫
accent = "#cba6f7"

# 文本与前景色
text = "#cdd6f4"
subtext0 = "#a6adc8"

# 功能状态色
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
mauve = "#cba6f7"
blue = "#89dceb"
peach = "#fab387"

# 选中行与背景色块（用带一点紫调的深灰色，避免破坏透明感，又保证文字清晰）
active_row_bg = "#313244"
selection_bg = "#45475a"

# 边框和分隔线
surface_dim = "#585b70"

# ==========================================
# 终端与目录策略喵
# ==========================================
[terminal]
default_shell = "fish"
new_cwd = "follow"

# ==========================================
# 快捷键喵
# ==========================================
[keys]
prefix = "ctrl+space"

# 自定义命令喵：按 prefix+y 弹出一个 yazi 小窗
[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "90%"
height = "85%"

# reviewr 插件喵
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "切换 reviewr 喵"

# herdr-sidebar 插件喵
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "开关 herdr-sidebar 喵"

# ==========================================
# UI 与通知喵
# ==========================================
[ui]
sidebar_width = 26
sidebar_collapsed_mode = "compact"
pane_borders = true
pane_gaps = true
status_indicators = "dots"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab", "state_text"], ["agent"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 2
[ui.toast.herdr]
position = "bottom-right"

# ==========================================
# 会话与更新喵
# ==========================================
[session]
resume_agents_on_restore = true

[update]
channel = "stable"
version_check = true

# ==========================================
# 远程与实验性功能喵
# ==========================================
[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
pane_history = false
switch_ascii_input_source_in_prefix = false
reveal_hidden_cursor_for_cjk_ime = false

[advanced]
scrollback_limit_bytes = 20000000