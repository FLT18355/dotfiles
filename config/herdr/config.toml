onboarding = false
# herdr 配置喵~ 放在 ~/.config/herdr/config.toml 就对啦

# ==========================================
# 主题与外观喵
# ==========================================
[theme]
# 内置主题喵：catppuccin, terminal, tokyo-night, dracula, nord...
name = "catppuccin"
auto_switch = false
# 如果想微调颜色，可以用 [theme.custom] 覆盖喵
# 比如：accent = "#f5c2e7"

# ==========================================
# 终端与目录策略喵
# ==========================================
[terminal]
default_shell = "fish"
# "follow" 会跟着当前窗格走，不会每次都跑回主目录喵
new_cwd = "follow"

# ==========================================
# 快捷键喵
# ==========================================
[keys]
# 用 ctrl+space 当前缀键，顺手又不容易撞车喵
prefix = "ctrl+space"

# 下面是默认动作，想用就取消注释喵
# new_tab = "prefix+c"
# close_tab = "prefix+shift+x"
# split_vertical = "prefix+v"
# split_horizontal = "prefix+minus"
# close_pane = "prefix+x"
# toggle_sidebar = "prefix+b"

# 自定义命令喵：按 prefix+y 弹出一个 yazi 小窗
[[keys.command]]
key = "prefix+y"
type = "popup"
command = "yazi"
width = "90%"
height = "85%"

# reviewr 插件喵
[[keys.command]]
key = "prefix+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "切换 reviewr 喵"

# herdr-sidebar 插件喵（统一到 prefix 下，不用按一堆 ctrl+alt 啦）
[[keys.command]]
key = "prefix+s"
type = "plugin_action"
command = "herdr-sidebar.open-sidebar"
description = "开关 herdr-sidebar 喵"

# ==========================================
# UI 与通知喵
# ==========================================
[ui]
sidebar_width = 26
sidebar_collapsed_mode = "compact"
pane_borders = true
pane_gaps = true
# 给 Catppuccin 加一点品牌蓝做高亮喵
accent = "#89b4fa"
status_indicators = "dots"
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab", "state_text"], ["agent"]]

[ui.toast]
delivery = "herdr"
delay_seconds = 2
[ui.toast.herdr]
position = "bottom-right"

# ==========================================
# 会话与更新喵
# ==========================================
[session]
resume_agents_on_restore = true

[update]
channel = "stable"
version_check = true

# ==========================================
# 远程与实验性功能喵
# ==========================================
[remote]
manage_ssh_config = true

[experimental]
# 坚决不允许嵌套喵，不然快捷键会打架的
allow_nested = false
pane_history = false
switch_ascii_input_source_in_prefix = false
reveal_hidden_cursor_for_cjk_ime = false

[advanced]
# 滚动缓冲大概 20MB，够用喵
scrollback_limit_bytes = 20000000