gui:
  theme: # Catppuccin Mocha · 紫色主调
    activeBorderColor:
      - '#cba6f7' # Mauve (激活边框 · 主紫)
      - bold
    inactiveBorderColor:
      - '#a6adc8' # Subtext0 (非激活边框)
    optionsTextColor:
      - '#b4befe' # Lavender (选项文字 · 淡紫)
    selectedLineBgColor:
      - '#313244' # Surface0 (选中行背景)
    selectedRangeBgColor:
      - '#45475a' # Surface1 (多选范围背景)
    cherryPickedCommitBgColor:
      - '#45475a' # Surface1
    cherryPickedCommitFgColor:
      - '#f5c2e7' # Pink (cherry-pick 提交)
    unstagedChangesColor:
      - '#f38ba8' # Red (未暂存更改，保留红色以免被紫色淹没)
    defaultFgColor:
      - '#cdd6f4' # Text (默认前景色)
    searchingActiveBorderColor:
      - '#cba6f7' # Mauve (搜索时的边框 · 与激活边框统一)
    authorColors:
      '*': '#b4befe' # Lavender (作者名)

  showBottomLine: false
  border: rounded
  nerdFontsVersion: "3" # 开启 Nerd Font v3 图标

  spinner:
    frames:
      - '⣾'
      - '⣽'
      - '⣻'
      - '⢿'
      - '⡿'
      - '⣟'
      - '⣯'
      - '⣷'

  showRandomTip: false
  showCommandLog: false
  showFileTree: true       # 左侧显示文件树
  showListFooter: false    # 隐藏底部列表统计

os:
  editPreset: "nvim-remote"

promptToReturnFromSubprocess: false

keybinding:
  universal:
    quit: q
    quit-alt1: <c-c>
  commits:
    moveDownCommit: <c-x>
    moveUpCommit: <c-w>